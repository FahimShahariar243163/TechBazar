const state={

};

// ================= HELPERS (সাহায্যকারী) =================
// Reads saved data from localStorage | localStorage থেকে ডেটা পড়ে
function load(key,fallback){
  try{ const saved=localStorage.getItem("tb_"+key); return saved?JSON.parse(saved):fallback; }
  catch(e){ return fallback; }
}
// Saves data to localStorage | localStorage-এ ডেটা রাখে
function save(key,value){
  try{ localStorage.setItem("tb_"+key,JSON.stringify(value)); }catch(e){}
}
// Saves everything that must survive a refresh | রিফ্রেশের পরেও যা থাকবে সব সংরক্ষণ
function saveAll(){
  save("cart",state.cart); save("wishlist",state.wishlist); save("orders",state.orders);
  save("userEmail",state.userEmail); save("dark",state.dark); save("lang",state.lang);
}
// Shows a number as Taka | সংখ্যাকে টাকায় দেখায়
function money(n){ return "৳"+Math.round(n).toLocaleString("en-IN"); }
// Text in the current language | বর্তমান ভাষার লেখা
function t(key){ return words[state.lang][key]||key; }
// Finds a product by id | আইডি দিয়ে পণ্য খোঁজে
function getProduct(id){ return products.find(function(p){ return p.id===id; }); }
// Discount percent from old and new price | ছাড়ের শতাংশ হিসাব
function discountPercent(p){ return Math.round((p.old-p.price)/p.old*100); }
// Rating as stars | রেটিং তারা হিসেবে
function stars(r){ const full=Math.round(r); return "★".repeat(full)+"☆".repeat(5-full); }
// Reads one trimmed input value | ইনপুটের মান পড়ে
function val(id){ return document.getElementById(id).value.trim(); }
// Adds a leading zero | সংখ্যার আগে ০ বসায়
function pad(n){ return n<10?"0"+n:""+n; }
// Small popup message | ছোট বার্তা দেখায়
function toast(msg){
  const el=document.getElementById("toast");
  el.textContent=msg; el.style.opacity=1;
  setTimeout(function(){ el.style.opacity=0; },2000);
}
// Cart maths: subtotal, coupon, delivery, 5% VAT, total | কার্টের সব হিসাব
function calculateTotal(){
  let subtotal=0;
  state.cart.forEach(function(item){ subtotal+=getProduct(item.id).price*item.qty; });
  const percent=coupons[state.coupon]||0;
  const discount=subtotal*percent/100;
  const taxable=subtotal-discount;
  const delivery=(subtotal===0||subtotal>=5000)?0:100;
  const vat=taxable*0.05;
  return {subtotal:subtotal,discount:discount,delivery:delivery,vat:vat,total:taxable+vat+delivery};
}
// Filters and sorts products for the shop page | শপ পেজের জন্য ফিল্টার ও সাজানো
function getVisibleProducts(){
  const q=state.search.toLowerCase();
  const list=products.filter(function(p){
    const okCategory=state.category==="all"||p.category===state.category;
    const okPrice=p.price<=state.maxPrice;
    const okStock=!state.inStockOnly||p.stock>0;
    const okSearch=q===""||(p.name+" "+p.brand).toLowerCase().includes(q);
    return okCategory&&okPrice&&okStock&&okSearch;
  });
  if(state.sort==="low") list.sort(function(a,b){ return a.price-b.price; });
  if(state.sort==="high") list.sort(function(a,b){ return b.price-a.price; });
  if(state.sort==="rating") list.sort(function(a,b){ return b.rating-a.rating; });
  if(state.sort==="popular") list.sort(function(a,b){ return b.reviews-a.reviews; });
  return list;
}

// Shows the current banner slide with automatic rotation and touch/mouse swiping.
let bannerAutoplay=null;
function stopBannerAutoplay(){if(bannerAutoplay!==null){clearInterval(bannerAutoplay);bannerAutoplay=null;}}
function startBannerAutoplay(){
  stopBannerAutoplay();
  if(document.getElementById("banner")) bannerAutoplay=setInterval(function(){nextBanner();},5500);
}
function showBanner(){
  const box=document.getElementById("banner");
  if(!box) return;
  const s=slides[state.slide];
  const bannerImages=[
    "https://images.unsplash.com/photo-1498049794561-7780e7231661?auto=format&fit=crop&w=1600&q=85",
    "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=1600&q=85",
    "https://images.unsplash.com/photo-1496181133206-80ce9b88a853?auto=format&fit=crop&w=1600&q=85"
  ];
  box.className="rounded-2xl text-white banner-enter";
  box.style.backgroundImage="url('"+bannerImages[state.slide]+"')";
  box.setAttribute("role","region");
  box.setAttribute("aria-label","Featured offers. Swipe left or right to change slides.");
  box.innerHTML='<div class="banner-shade rounded-2xl"></div><div class="banner-content p-8 md:p-14"><span class="inline-flex items-center gap-2 rounded-full border border-white/25 bg-white/10 px-3 py-1 text-xs md:text-sm font-semibold tracking-wide text-white backdrop-blur-sm"><span class="inline-block h-2 w-2 rounded-full bg-emerald-300 shadow-[0_0_12px_rgba(110,231,183,.9)]"></span>TECHBAZAR BD · FEATURED OFFER</span><h1 class="banner-title text-3xl md:text-5xl font-extrabold gradient-heading mt-4">'+s.title+'</h1><p class="mt-3 max-w-xl text-sm md:text-lg leading-relaxed text-white/90">'+s.sub+'</p><button onclick="go(\'shop\')" class="mt-6 bg-white text-indigo-700 font-bold rounded-xl px-5 py-3 shadow-lg">'+t("shop")+' <span aria-hidden="true">→</span></button><p class="mt-4 text-xs text-white/75">Swipe or drag to explore · Changes automatically</p></div><div class="banner-progress"><span></span></div>';
  if(!box.dataset.swipeBound){
    let startX=0,startY=0,pointerX=null;
    function moveSlide(direction){state.slide=(state.slide+(direction>0?1:slides.length-1))%slides.length;showBanner();}
    box.addEventListener("touchstart",function(e){if(!e.touches||!e.touches[0])return;startX=e.touches[0].clientX;startY=e.touches[0].clientY;stopBannerAutoplay();},{passive:true});
    box.addEventListener("touchend",function(e){if(!e.changedTouches||!e.changedTouches[0]){startBannerAutoplay();return;}const dx=e.changedTouches[0].clientX-startX;const dy=e.changedTouches[0].clientY-startY;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy))moveSlide(dx<0?1:-1);else startBannerAutoplay();},{passive:true});
    box.addEventListener("pointerdown",function(e){if(e.pointerType==="mouse"){pointerX=e.clientX;stopBannerAutoplay();}});
    box.addEventListener("pointerup",function(e){if(pointerX===null)return;const dx=e.clientX-pointerX;pointerX=null;if(Math.abs(dx)>65)moveSlide(dx<0?1:-1);else startBannerAutoplay();});
    box.addEventListener("pointercancel",function(){pointerX=null;startBannerAutoplay();});
    box.addEventListener("mouseenter",stopBannerAutoplay);
    box.addEventListener("mouseleave",startBannerAutoplay);
    box.dataset.swipeBound="1";
  }
  startBannerAutoplay();
}
// Shows time left today for the flash sale | ফ্ল্যাশ সেলের বাকি সময়
function updateTimer(){
  const el=document.getElementById("timer");
  if(!el) return;
  const end=new Date();
  end.setHours(23,59,59,999);
  const sec=Math.floor((end-new Date())/1000);
  el.textContent=pad(Math.floor(sec/3600))+":"+pad(Math.floor(sec%3600/60))+":"+pad(sec%60);
}

// Printable invoice with journal entry and Debit = Credit check | ইনভয়েস, জার্নাল এন্ট্রি ও ডেবিট = ক্রেডিট যাচাই
function renderInvoice(){
  const o=state.orders.find(function(x){ return x.id===state.invoiceId; });
  if(!o) return renderOrders();
  const c=o.totals;
  const rows=o.items.map(function(i){
    return '<tr class="border-b"><td>'+i.name+'</td><td>'+i.qty+'</td><td class="text-right">'+money(i.price*i.qty)+'</td></tr>';
  }).join("");
  const debitName=o.pay==="Cash on Delivery"?"Accounts Receivable":"Cash / Bank";
  const revenue=c.subtotal-c.discount+c.delivery;
  const debitTotal=c.total;
  const creditTotal=revenue+c.vat;
  const balanced=Math.abs(debitTotal-creditTotal)<0.01;
  return '<div class="box"><h1 class="text-2xl font-bold">TechBazar BD Invoice #'+o.id+'</h1>'+
    '<p class="text-sm">'+o.date+', '+o.name+', '+o.phone+'<br>'+o.address+', '+o.division+'</p>'+
    '<table class="w-full text-sm my-3"><tr class="border-b font-bold"><td>Item</td><td>Qty</td><td class="text-right">Amount</td></tr>'+rows+'</table>'+
    '<div class="text-sm">'+row("Subtotal",money(c.subtotal))+row("Discount","-"+money(c.discount))+row("Delivery",money(c.delivery))+row("VAT (5%)",money(c.vat))+row("<b>Total</b>","<b>"+money(c.total)+"</b>")+'</div>'+
    '<h2 class="font-bold mt-4">Journal Entry</h2>'+
    '<table class="w-full text-sm"><tr class="font-bold border-b"><td>Account</td><td class="text-right">Debit</td><td class="text-right">Credit</td></tr>'+
    '<tr><td>'+debitName+' A/c Dr.</td><td class="text-right">'+money(debitTotal)+'</td><td></td></tr>'+
    '<tr><td class="pl-6">To Sales Revenue A/c</td><td></td><td class="text-right">'+money(revenue)+'</td></tr>'+
    '<tr><td class="pl-6">To VAT Payable A/c</td><td></td><td class="text-right">'+money(c.vat)+'</td></tr>'+
    '<tr class="font-bold border-t"><td>Total</td><td class="text-right">'+money(debitTotal)+'</td><td class="text-right">'+money(creditTotal)+'</td></tr></table>'+
    '<p class="mt-2 font-bold '+(balanced?"text-green-600":"text-red-600")+'">'+(balanced?"✔ Debit = Credit (balanced)":"✘ Not balanced")+'</p>'+
    '<button class="btn mt-3 noprint" onclick="window.print()">🖨️ Print</button></div>';
}

laceholder="you@example.com"><label for="loginPassword" class="block text-sm font-semibold mb-1">Password</label><input id="loginPassword" type="password" autocomplete="current-password" minlength="4" required class="inp" placeholder="At least 4 characters"><p class="text-xs text-slate-500 dark:text-slate-400 mt-2">Demo only: no password is stored or verified.</p><button type="submit" class="btn w-full mt-5 py-3 font-bold">Sign in <span aria-hidden="true">→</span></button></form><div class="text-center text-sm text-slate-500 dark:text-slate-400 mt-5">New here? <button onclick="demoRegister()" class="font-bold text-indigo-600 dark:text-indigo-300 underline">Create a demo account</button></div><button onclick="go(&#39;home&#39;)" class="w-full mt-4 text-sm font-semibold text-slate-500 hover:text-indigo-600">← Back to store</button></div></div></section>';

function escapeHtml(value){return String(value).replace(/[&<>"']/g,function(ch){return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;", "'":"&#39;"})[ch];});}
function submitLogin(){
  const email=document.getElementById("loginEmail");
  const password=document.getElementById("loginPassword");
  if(!email||!password||!email.checkValidity()||password.value.length<4){toast("Enter a valid email and a password of at least 4 characters");return;}
  state.userEmail=email.value.trim();
  toast("Demo sign-in successful");
  render();window.scrollTo(0,0);
}
function demoRegister(){toast("Demo account: enter your email and a password to continue");const email=document.getElementById("loginEmail");if(email)email.focus();}
function logoutDemo(){state.userEmail="";toast("You have signed out");render();window.scrollTo(0,0);}

// MAIN render: draws the current page from state | মূল render: state অনুযায়ী পেজ আঁকে
function render(){
  document.documentElement.classList.toggle("dark",state.dark);
  document.getElementById("navShop").textContent=t("shop");
  document.getElementById("navOrders").textContent=t("orders");
  document.getElementById("navLogin").textContent=state.userEmail?"My account":"Log in";
  document.getElementById("searchBox").placeholder=t("search");
  document.getElementById("cartCount").textContent=state.cart.reduce(function(sum,i){ return sum+i.qty; },0);
  const pages={home:renderHome,shop:renderShop,product:renderProduct,cart:renderCart,checkout:renderCheckout,success:renderSuccess,orders:renderOrders,invoice:renderInvoice,login:renderLogin};
  document.getElementById("app").innerHTML=pages[state.page]();
  showBanner();
  updateTimer();
  saveAll();
}

// ================= EVENT ACTIONS (ইভেন্ট অ্যাকশন) =================
// Goes to a page | পেজ বদলায়
function go(page){ state.page=page; render(); window.scrollTo(0,0); }
// Opens one product | একটি পণ্য খোলে
function openProduct(id){ state.selectedId=id; go("product"); }
// Picks a category and opens the shop | ক্যাটাগরি বাছে
function setCategory(c){ state.category=c; go("shop"); }
// Sets max price filter | সর্বোচ্চ দাম ফিল্টার
function setPrice(v){ state.maxPrice=Number(v); render(); }
// Sets in-stock filter | স্টকে আছে ফিল্টার
function setStock(v){ state.inStockOnly=v; render(); }
// Sets sort order | সাজানোর নিয়ম
function setSort(v){ state.sort=v; render(); }
// Live search from the header box | হেডার সার্চ
function onSearch(v){ state.search=v; if(state.page!=="shop"){ go("shop"); } else { render(); } }
// Reads the quantity box on the product page | পরিমাণ বক্স পড়ে
function readQty(){ const n=parseInt(document.getElementById("qty").value); return n>0?n:1; }
// Adds a product to the cart (never above stock) | কার্টে পণ্য যোগ করে
function addToCart(id,qty){
  const p=getProduct(id);
  if(p.stock===0){ toast("Out of stock"); return; }
  const item=state.cart.find(function(i){ return i.id===id; });
  if(item){ item.qty=Math.min(item.qty+qty,p.stock); }
  else { state.cart.push({id:id,qty:Math.min(qty,p.stock)}); }
  toast("🛒 "+p.name+" added");
  render();
}
// Adds to cart and goes straight to checkout | কার্টে যোগ করে সরাসরি চেকআউটে
function buyNow(id){ addToCart(id,readQty()); go("checkout"); }
// Changes quantity by +1 or -1 | পরিমাণ বাড়ায়/কমায়
function changeQty(id,delta){
  const item=state.cart.find(function(i){ return i.id===id; });
  item.qty=item.qty+delta;
  if(item.qty<1) item.qty=1;
  if(item.qty>getProduct(id).stock) item.qty=getProduct(id).stock;
  render();
}
// Removes a product from the cart | কার্ট থেকে সরায়
function removeItem(id){
  state.cart=state.cart.filter(function(i){ return i.id!==id; });
  toast("Item removed");
  render();
}
// Checks and applies a coupon code | কুপন যাচাই ও প্রয়োগ
function applyCoupon(){
  const code=val("couponBox").toUpperCase();
  if(coupons[code]){ state.coupon=code; toast("Coupon applied: "+coupons[code]+"% off"); }
  else { state.coupon=""; toast("Invalid coupon"); }
  render();
}
// Adds or removes a wishlist heart | উইশলিস্টে যোগ/বাদ
function toggleWishlist(id){
  if(state.wishlist.includes(id)){
    state.wishlist=state.wishlist.filter(function(w){ return w!==id; });
    toast("Removed from wishlist");
  } else {
    state.wishlist.push(id);
    toast("❤️ Added to wishlist");
  }
  render();
}
// Validates the form, saves the order, empties the cart | ফর্ম যাচাই করে অর্ডার সেভ করে
function placeOrder(){
  const name=val("fName"), phone=val("fPhone"), address=val("fAddr");
  if(name.length<3){ toast("Enter your full name"); return; }
  if(!/^01[3-9][0-9]{8}$/.test(phone)){ toast("Phone must look like 01XXXXXXXXX"); return; }
  if(address.length<6){ toast("Enter your full address"); return; }
  const items=state.cart.map(function(i){
    const p=getProduct(i.id);
    return {name:p.name,price:p.price,qty:i.qty};
  });
  const district=val("fDist");
  const order={
    id:"TB"+String(Date.now()).slice(-8), date:new Date().toLocaleString(),
    name:name, phone:phone, address:address,
    division:val("fDiv")+(district?", "+district:""),
    pay:document.querySelector('input[name="pay"]:checked').value,
    items:items, totals:calculateTotal(), status:0
  };
  state.orders.unshift(order);
  state.lastOrderId=order.id;
  state.cart=[];
  state.coupon="";
  toast("✅ Order placed!");
  go("success");
}
// Moves an order to the next tracker step (demo, no backend) | অর্ডার পরের ধাপে নেয়
function advanceStatus(id){
  const o=state.orders.find(function(x){ return x.id===id; });
  if(o.status<3){ o.status=o.status+1; toast("Status updated"); }
  render();
}
// Opens the invoice of one order | ইনভয়েস খোলে
function showInvoice(id){ state.invoiceId=id; go("invoice"); }
// Dark mode on/off | ডার্ক মোড অন/অফ
function toggleDark(){ state.dark=!state.dark; render(); }
// English / Bangla switch | ইংরেজি / বাংলা পরিবর্তন
function toggleLang(){ state.lang=state.lang==="en"?"bn":"en"; toast(state.lang==="en"?"English":"বাংলা"); render(); }
// Moves the banner to the next slide | পরের স্লাইড
function nextBanner(){ if(!document.getElementById("banner")) return; state.slide=(state.slide+1)%slides.length; showBanner(); }

// ================= STARTUP (শুরু) =================
render();
setInterval(updateTimer,1000);
</script>
